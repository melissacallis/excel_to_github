<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Status &middot; Crisis Respite Program</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --ink: #1c2b29;
    --slate: #48605c;
    --muted: #5f716e;
    --line: #dfe6e2;
    --paper: #f2f6f4;
    --card: #ffffff;
    --teal-deep: #0d3d33;
    --teal: #12735c;
    --teal-light: #e2f2ec;
    --sage: #9ec2b3;
    --male-bg: #dceaf6;
    --male-fg: #2c5f8a;
    --female-bg: #e7ddf5;
    --female-fg: #5e3a96;
    --red: #a32d2d;
    --red-bg: #fbe9e9;
    --amber: #8a5a0b;
    --amber-bg: #fdf1de;
    --green: #276a2f;
    --green-bg: #e9f3e8;
    --doctor-bg: #dbe9fb;
    --doctor-fg: #1f4f8f;
    --casemgr-bg: #ece1f9;
    --casemgr-fg: #5a2f96;
    --other-bg: #fdeadb;
    --other-fg: #935a15;
    --shadow: 0 1px 2px rgba(20,40,35,0.06), 0 4px 14px rgba(20,40,35,0.05);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "IBM Plex Sans", "Segoe UI", -apple-system, Helvetica, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  /* ---- Keyboard focus: always visible ---- */
  button:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
  header button:focus-visible { outline-color: #ffffff; }

  /* ---- Banner: Patient Status + bed census ---- */
  header {
    background: var(--teal-deep);
    color: #fff;
    padding: 22px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px 32px;
    box-shadow: var(--shadow);
  }
  .brand { display: flex; flex-direction: column; gap: 6px; }
  .brand .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 1.6px; text-transform: uppercase; color: rgba(255,255,255,0.88); }
  .brand h1 { font-size: 32px; font-weight: 700; margin: 0; letter-spacing: -0.3px; line-height: 1.1; }
  .header-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header .meta { font-family: "IBM Plex Mono", monospace; font-size: 13px; color: rgba(255,255,255,0.9); font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #6fd3a0; display: inline-block; margin-right: 6px; flex-shrink: 0; }
  button.icon-btn {
    background: transparent; border: 1px solid rgba(255,255,255,0.5);
    color: #fff; border-radius: 8px; padding: 0 16px; min-height: 44px; font-size: 13px; cursor: pointer;
  }
  button.icon-btn:hover { background: rgba(255,255,255,0.12); }

  .census { background: rgba(255,255,255,0.08); border-radius: 14px; padding: 14px 18px; display: flex; flex-direction: column; gap: 9px; }
  .census-head { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; }
  .census-title { font-size: 12px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: rgba(255,255,255,0.88); }
  .census-total { font-size: 14px; font-weight: 600; }
  .census-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .census-label { width: 56px; font-size: 12px; color: rgba(255,255,255,0.88); }
  .bed-chip {
    width: 40px; height: 28px; border-radius: 6px; font-family: "IBM Plex Mono", monospace;
    font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center;
  }
  .bed-chip.male { background: var(--male-bg); color: var(--male-fg); }
  .bed-chip.female { background: var(--female-bg); color: var(--female-fg); }
  .bed-chip.open { border: 1px dashed rgba(255,255,255,0.55); color: rgba(255,255,255,0.8); font-weight: 500; }
  .census-key { font-size: 11px; color: rgba(255,255,255,0.8); }

  main { max-width: 1080px; margin: 0 auto; padding: 26px 20px 60px; }

  #config-screen {
    max-width: 480px; margin: 60px auto; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; padding: 32px; box-shadow: var(--shadow);
  }
  #config-screen h2 { font-size: 16px; margin: 0 0 8px; color: var(--teal-deep); }
  #config-screen p { font-size: 13px; color: var(--muted); line-height: 1.5; margin: 0 0 20px; }
  #config-screen label { font-size: 12px; font-weight: 600; color: var(--slate); display: block; margin-bottom: 6px; }
  #config-screen input {
    width: 100%; padding: 10px 12px; font-size: 13px;
    border: 1px solid var(--line); border-radius: 8px; margin-bottom: 16px;
  }
  #config-screen button {
    background: var(--teal); color: #fff; border: none; border-radius: 8px;
    padding: 11px 18px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%;
  }
  #config-error { color: var(--red); font-size: 12px; margin-top: 10px; display: none; }

  .summary-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
  .summary-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px; box-shadow: var(--shadow);
  }
  .summary-card .num { font-size: 27px; font-weight: 700; line-height: 1; }
  .summary-card .lbl { font-size: 11px; color: var(--muted); margin-top: 7px; letter-spacing: 0.3px; text-transform: uppercase; }
  .summary-card.red .num { color: var(--red); }
  .summary-card.amber .num { color: var(--amber); }
  .summary-card.green .num { color: var(--green); }
  .summary-card.teal .num { color: var(--teal-deep); }

  .filter-row { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; align-items: center; }
  .filter-btn {
    border: 1px solid #8a9b97; background: var(--card); border-radius: 22px;
    padding: 0 18px; min-height: 44px; font-size: 13.5px; cursor: pointer; color: var(--slate);
  }
  .filter-btn.active { background: var(--teal-deep); color: #fff; border-color: var(--teal-deep); }

  .legend { display: flex; gap: 16px; margin-left: auto; align-items: center; font-size: 12px; color: var(--muted); }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 5px; vertical-align: -1px; }
  .legend-dot.male { background: var(--male-fg); }
  .legend-dot.female { background: var(--female-fg); }

  .board-columns { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
  .board-column-header {
    display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700;
    color: var(--slate); text-transform: uppercase; letter-spacing: 0.4px;
    margin: 0 0 12px; padding-bottom: 8px; border-bottom: 2px solid var(--line);
  }
  .board-column-header .dot { width: 10px; height: 10px; border-radius: 50%; }
  .board-column-header.male .dot { background: var(--male-fg); }
  .board-column-header.female .dot { background: var(--female-fg); }

  .client-list { display: flex; flex-direction: column; gap: 7px; }

  .open-beds {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 10px 14px; border: 1px dashed #b9c6c2; border-radius: 9px; background: transparent;
    font-size: 13px; color: var(--muted);
  }
  .open-beds strong { color: var(--slate); margin-right: 4px; }
  .open-bed { font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: #e6ece9; color: var(--slate); }

  /* ---- Status row: what this patient needs, at a glance ---- */
  .status-row { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-bottom: 8px; margin-bottom: 2px; border-bottom: 1px solid var(--line); }
  .status-reason { font-size: 13px; color: var(--slate); }
  .status-ref { margin-left: auto; font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }

  .client-card {
    background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--line);
    border-radius: 9px; padding: 9px 14px; display: grid;
    grid-template-columns: 40px 1.3fr 1.3fr 1.3fr 1fr; gap: 10px; align-items: start; box-shadow: var(--shadow);
  }
  .client-card.gender-male { border-left-color: var(--male-fg); }
  .client-card.gender-female { border-left-color: var(--female-fg); }
  .client-card.gender-unknown { border-left-color: var(--line); }

  @keyframes med-flash {
    0%, 100% { box-shadow: var(--shadow); }
    50% { box-shadow: 0 0 0 3px rgba(226,59,59,0.35), var(--shadow); }
  }
  .client-card.med-due { animation: med-flash 1s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .client-card.med-due, .blinking { animation: none; }
  }

  .avatar {
    width: 36px; height: 36px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-weight: 700; font-size: 12px;
  }
  .avatar-col { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .avatar.male { background: var(--male-bg); color: var(--male-fg); }
  .avatar.female { background: var(--female-bg); color: var(--female-fg); }
  .avatar.unknown { background: var(--teal-light); color: var(--teal); }

  .field-label { font-size: 11px; color: var(--teal); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; font-weight: 700; padding-bottom: 4px; border-bottom: 1.5px solid var(--teal-light); }

  .client-card .cell { border-left: 1px solid var(--line); padding-left: 12px; align-self: stretch; min-width: 0; }
  .appt-group { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 2px; }
  .field-value { font-size: 14px; color: var(--ink); font-weight: 600; letter-spacing: -0.1px; }
  .field-value.big { font-size: 16px; font-weight: 800; margin-bottom: 5px; }
  .field-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

  .data-line { display: flex; align-items: baseline; gap: 6px; font-size: 12.5px; margin-top: 3px; line-height: 1.4; min-width: 0; }
  .data-line .k {
    font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.5px; min-width: 30px; flex-shrink: 0;
  }
  .data-line .v { color: var(--ink); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .data-line .v.time-missing { color: var(--red); font-weight: 700; white-space: normal; }

  .badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 4px 11px; border-radius: 20px; white-space: nowrap; }
  .badge.red { background: var(--red-bg); color: var(--red); }
  .badge.amber { background: var(--amber-bg); color: var(--amber); }
  .badge.green { background: var(--green-bg); color: var(--green); }
  .badge.muted { background: #eef1f0; color: var(--muted); }

  .flags { margin-top: 6px; }

  .appt-badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 6px; margin-top: 4px; }
  .appt-badge.doctor { background: var(--doctor-bg); color: var(--doctor-fg); }
  .appt-badge.casemgr { background: var(--casemgr-bg); color: var(--casemgr-fg); }
  .appt-badge.other { background: var(--other-bg); color: var(--other-fg); }

  @keyframes pulse-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  .blinking { animation: pulse-blink 1.4s ease-in-out infinite; }

  .notes-row {
    grid-column: 1 / -1; margin-top: 6px; padding-top: 10px; border-top: 1px dashed var(--line);
    font-size: 12.5px; color: var(--slate); font-style: italic;
  }
  .notes-row .notes-label {
    font-style: normal; font-weight: 700; color: var(--muted);
    text-transform: uppercase; font-size: 11px; letter-spacing: 0.4px; margin-right: 6px;
  }

  /* One meaning per color: yellow = waiting, blue = scheduled/in progress, green = done, gray = other */
  .status-chip { display: inline-block; max-width: 100%; white-space: normal; overflow-wrap: break-word; line-height: 1.3; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 6px; margin-top: 4px; }
  .status-chip.chip-amber { background: var(--amber-bg); color: var(--amber); }
  .status-chip.chip-blue { background: var(--doctor-bg); color: var(--doctor-fg); }
  .status-chip.chip-green { background: var(--green-bg); color: var(--green); }
  .status-chip.chip-gray { background: #eef1f0; color: var(--muted); }
  .status-chip.chip-yellow { background: #ffe9a6; color: #6b5200; }

  .referral-tag {
    font-size: 11px; font-weight: 600;
    background: var(--teal-light); color: var(--teal-deep);
    padding: 2px 8px; border-radius: 6px;
    display: inline-block; white-space: nowrap; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; vertical-align: middle;
  }

  .med-banner { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 7px 12px; margin: 0; border-radius: 7px; }

  .bed-days-square {
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
    margin-top: 7px; min-width: 46px; padding: 5px 8px;
    background: var(--teal-light); border-radius: 8px; line-height: 1;
  }
  .bed-days-square .bd-num { font-size: 15px; font-weight: 700; color: var(--teal-deep); }
  .bed-days-square .bd-lbl { white-space: nowrap; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: var(--slate); margin-top: 3px; }
  .bed-days-square.bed-days-high { background: var(--amber-bg); }
  .bed-days-square.bed-days-high .bd-num { color: var(--amber); }
  .bed-days-square.bed-days-high .bd-lbl { color: var(--amber); }

  .empty-state, .error-state { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; }
  .error-state { color: var(--red); }

  @media (max-width: 760px) {
    .client-card { grid-template-columns: 1fr; }
    .summary-bar { grid-template-columns: repeat(2, 1fr); }
    .board-columns { grid-template-columns: 1fr; }
    .legend { margin-left: 0; }
    header { padding: 18px 16px; }
    .brand h1 { font-size: 26px; }
    .census { width: 100%; }
    .bed-chip { width: 34px; }
    .census-label { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="eyebrow">Crisis Respite Program</div>
    <h1>Patient Status</h1>
    <div class="header-meta">
      <span class="meta" id="last-updated"><span class="status-dot" aria-hidden="true"></span>Connecting...</span>
      <button type="button" class="icon-btn" onclick="refreshNow()">Refresh</button>
    </div>
  </div>
  <section class="census" id="census" aria-label="Bed census" style="display:none;">
    <div class="census-head">
      <span class="census-title">Bed census</span>
      <span class="census-total" id="census-total"></span>
    </div>
    <div class="census-row" id="census-male"><span class="census-label">Men</span></div>
    <div class="census-row" id="census-female"><span class="census-label">Women</span></div>
    <div class="census-key">Filled = in use · dashed = open</div>
  </section>
</header>
<div class="visually-hidden" aria-live="polite" id="sr-announce"></div>

<main>

  <div id="dashboard" style="display:none;">
    <div class="summary-bar">
      <div class="summary-card red"><div class="num" id="count-red">0</div><div class="lbl">Needs action</div></div>
      <div class="summary-card amber"><div class="num" id="count-amber">0</div><div class="lbl">Upcoming</div></div>
      <div class="summary-card green"><div class="num" id="count-green">0</div><div class="lbl">On track</div></div>
      <div class="summary-card teal"><div class="num" id="count-total">0</div><div class="lbl">Total patients</div></div>
    </div>

    <div class="filter-row" role="group" aria-label="Filter patients by status">
      <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true" onclick="setFilter('all')">All</button>
      <button type="button" class="filter-btn" data-filter="red" aria-pressed="false" onclick="setFilter('red')">Needs action</button>
      <button type="button" class="filter-btn" data-filter="amber" aria-pressed="false" onclick="setFilter('amber')">Upcoming</button>
      <button type="button" class="filter-btn" data-filter="green" aria-pressed="false" onclick="setFilter('green')">On track</button>
      <div class="legend" aria-hidden="true">
        <span><span class="legend-dot male"></span>Men</span>
        <span><span class="legend-dot female"></span>Women</span>
      </div>
    </div>

    <div class="board-columns">
      <section aria-labelledby="col-male">
        <h2 class="board-column-header male" id="col-male"><span class="dot" aria-hidden="true"></span>Men</h2>
        <div class="client-list" id="client-list-male"></div>
      </section>
      <section aria-labelledby="col-female">
        <h2 class="board-column-header female" id="col-female"><span class="dot" aria-hidden="true"></span>Women</h2>
        <div class="client-list" id="client-list-female"></div>
      </section>
    </div>
    <div class="empty-state" id="empty-state" style="display:none;">No clients match this filter.</div>
  </div>

  <div class="error-state" id="error-state" style="display:none;"></div>

</main>

<script>
let clients = [];
let currentFilter = 'all';
let refreshTimer = null;

const APPT_SOON_DAYS = 2;
const MED_WINDOW_MIN = 15;

function initials(str) { return (str || '?').trim(); }

function genderFromBed(bed) {
  if (!bed) return 'unknown';
  const b = bed.trim().toUpperCase();
  if (b.startsWith('M')) return 'male';
  if (b.startsWith('F')) return 'female';
  return 'unknown';
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  if (isNaN(d)) return null;
  const today = new Date();
  today.setHours(0,0,0,0);
  d.setHours(0,0,0,0);
  return Math.round((d - today) / 86400000);
}

function bedDays(admitStr) {
  if (!admitStr) return null;
  const d = new Date(admitStr);
  if (isNaN(d)) return null;
  const today = new Date();
  today.setHours(0,0,0,0);
  d.setHours(0,0,0,0);
  const days = Math.round((today - d) / 86400000);
  return days >= 0 ? days : null;
}

function apptTypeClass(apptWith) {
  const v = (apptWith || '').trim().toLowerCase();
  if (v === 'doctor') return 'doctor';
  if (v === 'case manager') return 'casemgr';
  if (v === 'other') return 'other';
  return null;
}

// "8/12/2026" -> "Aug 12" (adds the year when it isn't this year). Leaves anything unparseable as-is.
function fmtDate(raw) {
  if (!raw) return '';
  const d = new Date(raw);
  if (isNaN(d)) return String(raw);
  const opts = { month: 'short', day: 'numeric' };
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
  return d.toLocaleDateString('en-US', opts);
}

function apptStatusClass(status) {
  const v = (status || '').trim().toLowerCase();
  if (v === 'requested' || v.indexOf('pending') !== -1) return 'chip-yellow';
  if (v === 'scheduled') return 'chip-blue';
  if (v === 'completed') return 'chip-green';
  return 'chip-gray';
}

function pharmStatusClass(status) {
  const v = (status || '').trim().toLowerCase();
  if (v.indexOf('submitted') !== -1 || v.indexOf('pending') !== -1) return 'chip-yellow';
  if (v === 'waiting scripts') return 'chip-yellow';
  if (v === 'dropped off') return 'chip-blue';
  if (v === 'picked up') return 'chip-green';
  return 'chip-gray';
}

// Turn raw med times ("8:00 AM / 8:00 PM | 7:00 AM | 8:00 AM") into a clean, unique,
// sorted list of just the distinct times ("7:00 AM, 8:00 AM, 8:00 PM").
function cleanMedTimes(raw) {
  if (!raw) return '';
  const pieces = String(raw).split(/[|\/]/);
  const seen = {};
  const times = [];
  pieces.forEach(p => {
    const t = p.trim();
    if (!t) return;
    const m = t.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
    if (!m) return;
    const key = t.toUpperCase();
    if (seen[key]) return;
    seen[key] = true;
    let h = parseInt(m[1], 10);
    const min = parseInt(m[2], 10);
    const ap = m[3].toUpperCase();
    if (ap === 'PM' && h !== 12) h += 12;
    if (ap === 'AM' && h === 12) h = 0;
    times.push({ label: t.replace(/\s+/g, ' '), sortVal: h * 60 + min });
  });
  times.sort((a, b) => a.sortVal - b.sortVal);
  return times.map(x => x.label).join(', ');
}

function nowInCentral() {
  const str = new Date().toLocaleString('en-US', { timeZone: 'America/Chicago' });
  return new Date(str);
}

function parseMedTimesToMinutes(medTimesStr) {
  const results = [];
  if (!medTimesStr) return results;
  const matches = medTimesStr.match(/\d{1,2}:\d{2}\s*(AM|PM)/gi);
  if (!matches) return results;
  matches.forEach(m => {
    const parts = m.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
    if (!parts) return;
    let h = parseInt(parts[1], 10);
    const min = parseInt(parts[2], 10);
    const ampm = parts[3].toUpperCase();
    if (ampm === 'PM' && h !== 12) h += 12;
    if (ampm === 'AM' && h === 12) h = 0;
    results.push(h * 60 + min);
  });
  return results;
}

// Returns 'due' when any med time is within 15 min before through 15 min after now
// (Central time), otherwise '' (show the normal listing).
function medStatus(medTimesStr) {
  const times = parseMedTimesToMinutes(medTimesStr);
  if (times.length === 0) return '';
  const central = nowInCentral();
  const nowMin = central.getHours() * 60 + central.getMinutes();
  for (const t of times) {
    let diff = Math.abs(t - nowMin);
    diff = Math.min(diff, 1440 - diff); // wrap around midnight
    if (diff <= MED_WINDOW_MIN) return 'due';
  }
  return '';
}

function evaluateScripts(c) {
  const status = (c['Scripts Status'] || '').trim().toLowerCase();
  if (status === 'submitted') return { label: 'Submitted \u2014 pending pharmacy', level: 'amber', blink: false };
  if (status === 'picked up' || status === 'ready' || status === 'ready for pickup') return { label: 'Ready / picked up', level: 'green', blink: false };
  if (status === 'dropped off') return { label: 'Dropped off at pharmacy', level: 'amber', blink: false };
  return { label: '', level: 'muted', blink: false };
}

function evaluateClient(c) {
  const apptDateRaw = c['Appointment Date'];
  let worst = 'green';
  const reasons = [];
  function escalate(level, why) {
    if (level === 'red') worst = 'red';
    else if (level === 'amber' && worst !== 'red') worst = 'amber';
    if (why) reasons.push({ level, why });
  }
  if (!apptDateRaw) {
    escalate('red', 'No appointment date');
  } else {
    const until = daysUntil(apptDateRaw);
    if (until !== null) {
      if (until < 0) escalate('red', 'Appointment date passed (' + fmtDate(apptDateRaw) + ')');
      else if (until === 0) escalate('amber', 'Appointment today');
      else if (until <= APPT_SOON_DAYS) escalate('amber', 'Appointment in ' + until + ' day' + (until === 1 ? '' : 's'));
    }
  }
  const scripts = evaluateScripts(c);
  if (scripts.level === 'red') escalate('red', scripts.label);
  else if (scripts.level === 'amber') escalate('amber', scripts.label);
  // red reasons first
  reasons.sort((a, b) => (a.level === 'red' ? 0 : 1) - (b.level === 'red' ? 0 : 1));
  return { urgency: worst, scripts, reasons: reasons.map(r => r.why) };
}

function buildCardHtml(c, ev) {
  const gender = genderFromBed(c['Bed']);
  const apptClass = apptTypeClass(c['Appointment With']);
  const apptBadgeHtml = apptClass ? `<span class="appt-badge ${apptClass}">${c['Appointment With']}</span>` : '';
  const scriptsClasses = ['badge', ev.scripts.level, ev.scripts.blink ? 'blinking' : ''].join(' ').trim();

  const notesText = (c['Notes'] || '').trim();
  const notesHtml = notesText ? `<div class="notes-row"><span class="notes-label">Notes</span>${notesText}</div>` : '';

  const card = document.createElement('div');
  const rawMedTimes = (c['Med Times'] || '').trim();
  const medTimes = cleanMedTimes(rawMedTimes);
  const mStatus = medStatus(rawMedTimes);
  card.className = `client-card gender-${gender} urgent-${ev.urgency}`;

  const apptStatus = (c['Appointment Status'] || '').trim();
  const apptStatusHtml = apptStatus ? `<span class="status-chip ${apptStatusClass(apptStatus)}">${breakAtSlash(apptStatus)}</span>` : '';

  const apptTime = (c['Appointment Time'] || '').trim();
  const isScheduled = apptStatus.toLowerCase() === 'scheduled';
  let timeLineHtml;
  if (apptTime) {
    timeLineHtml = `<div class="data-line"><span class="k">Time</span><span class="v">${apptTime}</span></div>`;
  } else if (isScheduled) {
    // Scheduled but no time entered - flag it
    timeLineHtml = `<div class="data-line"><span class="k">Time</span><span class="v time-missing">\u26a0 time needed</span></div>`;
  } else {
    timeLineHtml = `<div class="data-line"><span class="k">Time</span><span class="v">\u2014</span></div>`;
  }

  const pharmStatus = (c['Pharmacy Status'] || '').trim();
  const pharmStatusHtml = pharmStatus ? `<span class="status-chip ${pharmStatusClass(pharmStatus)}">${breakAtSlash(pharmStatus)}</span>` : '';

  const clockIcon = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/><path d="M6.38 18.7 4 21"/><path d="M17.64 18.67 20 21"/></svg>';
  let medTimesHtml = '';
  if (medTimes && mStatus === 'due') {
    medTimesHtml = `<div class="alert alert-success med-banner">${clockIcon}<span><strong>MEDS DUE NOW</strong> \u2014 ${medTimes}</span></div>`;
  } else if (medTimes) {
    medTimesHtml = `<div class="alert alert-info med-banner">${clockIcon}<span><strong>Med Times:</strong> ${medTimes}</span></div>`;
  }

  const referral = (c['Referral source'] || '').trim();
  const referralHtml = referral ? `<span class="referral-tag" title="Referred from ${referral}">${referral}</span>` : '';

  const statusLabel = { red: 'Needs action', amber: 'Upcoming', green: 'On track' }[ev.urgency];
  const reasonText = ev.reasons.length ? ev.reasons.join(' \u00b7 ') : 'Nothing due';

  card.innerHTML = `
    <div class="status-row">
      <span class="badge ${ev.urgency}">${statusLabel}</span>
      <span class="status-reason">${reasonText}</span>
      ${referralHtml ? `<span class="status-ref">Referred by ${referralHtml}</span>` : ''}
    </div>
    <div class="avatar-col">
      <div class="avatar ${gender}">${initials(c['Client Initials'])}</div>
    </div>
    <div class="cell">
      <div class="field-label">Patient</div>
      <div class="field-value big">${c['Bed'] || '\u2014'}</div>
      <div class="data-line"><span class="k">ID</span><span class="v">${c['Member ID'] || '\u2014'}</span></div>
      <div class="data-line"><span class="k">LOC</span><span class="v">${c['LOC'] || '\u2014'}</span></div>
      <div class="data-line"><span class="k">CM</span><span class="v" title="${c['Case Manager'] || ''}">${c['Case Manager'] || '\u2014'}</span></div>
    </div>
    <div class="cell">
      <div class="field-label">Appointment</div>
      <div class="appt-group">${apptBadgeHtml}${apptStatusHtml}</div>
      <div class="data-line"><span class="k">Date</span><span class="v">${fmtDate(c['Appointment Date']) || '\u2014'}</span></div>
      ${timeLineHtml}
    </div>
    <div class="cell">
      <div class="field-label">Scripts / Pharmacy</div>
      <div class="field-value">${c['Pharmacy'] || '\u2014'}</div>
      ${c['Doctor'] ? `<div class="data-line"><span class="k">Dr</span><span class="v">${c['Doctor']}</span></div>` : ''}
      ${ev.scripts.label ? `<div style="margin-top:5px;"><span class="${scriptsClasses}">${ev.scripts.label}</span></div>` : ''}
      ${pharmStatusHtml}
    </div>
    <div class="cell">
      <div class="field-label">Admitted</div>
      <div class="field-value">${fmtDate(c['Admit Date']) || '\u2014'}</div>
      ${(() => {
        const bd = bedDays(c['Admit Date']);
        if (bd === null) return '';
        const over = bd > 5 ? ' bed-days-high' : '';
        return `<div class="bed-days-square${over}"><span class="bd-num">${bd}</span><span class="bd-lbl">bed day${bd === 1 ? '' : 's'}</span></div>`;
      })()}
    </div>
  `;
  const flagRow = document.createElement('div');
  flagRow.className = 'flags';
  flagRow.style.gridColumn = '1 / -1';
  flagRow.innerHTML = medTimesHtml + notesHtml;
  card.appendChild(flagRow);
  return card;
}

// Let long chip labels like "Submitted/Pending" wrap after the slash instead of mid-word.
function breakAtSlash(t) { return String(t).replace(/\//g, '/\u200b'); }

// "M - 2B" -> "2B"
function shortBed(bed) {
  return String(bed || '').replace(/^\s*[MF]\s*-\s*/i, '').trim() || '?';
}

// One compact line listing every open bed in a column.
function buildOpenBedsLine(rows) {
  const line = document.createElement('div');
  line.className = 'open-beds';
  const chips = rows.map(r => `<span class="open-bed">${shortBed(r.raw['Bed'])}</span>`).join('');
  line.innerHTML = `<strong>Open beds (${rows.length})</strong>${chips}`;
  return line;
}

// Banner bed chart: every bed, filled when in use, dashed when open.
function renderCensus(evaluated) {
  const census = document.getElementById('census');
  if (!evaluated.length) { census.style.display = 'none'; return; }
  census.style.display = 'flex';
  const bedSort = (a, b) => (a.raw['Bed'] || '').localeCompare(b.raw['Bed'] || '', undefined, { numeric: true });
  let used = 0;
  ['male', 'female'].forEach(g => {
    const row = document.getElementById('census-' + g);
    row.querySelectorAll('.bed-chip').forEach(el => el.remove());
    evaluated.filter(e => e.gender === g).sort(bedSort).forEach(e => {
      const inUse = !!(e.raw['Client Initials'] || '').trim();
      if (inUse) used++;
      const chip = document.createElement('span');
      chip.className = 'bed-chip ' + (inUse ? g : 'open');
      chip.textContent = shortBed(e.raw['Bed']);
      chip.title = (e.raw['Bed'] || '') + (inUse ? ' \u2014 in use' : ' \u2014 open');
      row.appendChild(chip);
    });
  });
  document.getElementById('census-total').textContent = used + ' of ' + evaluated.length + ' beds in use';
}

// Tell screen readers (once) when a bed's meds become due, instead of re-reading every card each minute.
let lastDueBeds = '';
function announceMedsDue(evaluated) {
  const due = evaluated
    .filter(e => (e.raw['Client Initials'] || '').trim() && medStatus((e.raw['Med Times'] || '').trim()) === 'due')
    .map(e => e.raw['Bed']);
  const key = due.join('|');
  if (key && key !== lastDueBeds) {
    document.getElementById('sr-announce').textContent = 'Meds due now: ' + due.join(', ');
  }
  lastDueBeds = key;
}

function renderClients() {
  const listMale = document.getElementById('client-list-male');
  const listFemale = document.getElementById('client-list-female');
  const emptyState = document.getElementById('empty-state');
  listMale.innerHTML = '';
  listFemale.innerHTML = '';

  let counts = { red: 0, amber: 0, green: 0 };
  const evaluated = clients.map(c => ({ raw: c, eval: evaluateClient(c), gender: genderFromBed(c['Bed']) }));
  evaluated.forEach(item => { if ((item.raw['Client Initials'] || '').trim()) counts[item.eval.urgency]++; });

  document.getElementById('count-red').textContent = counts.red;
  document.getElementById('count-amber').textContent = counts.amber;
  document.getElementById('count-green').textContent = counts.green;
  document.getElementById('count-total').textContent = evaluated.filter(e => (e.raw['Client Initials'] || '').trim()).length;

  renderCensus(evaluated);
  announceMedsDue(evaluated);

  const occupied = e => !!(e.raw['Client Initials'] || '').trim();
  const bedSort = (a, b) => (a.raw['Bed'] || '').localeCompare(b.raw['Bed'] || '', undefined, { numeric: true });
  const shown = e => occupied(e) && (currentFilter === 'all' || e.eval.urgency === currentFilter);

  let shownCount = 0;
  [['male', listMale], ['female', listFemale]].forEach(([g, list]) => {
    const rows = evaluated.filter(e => e.gender === g).sort(bedSort);
    rows.filter(shown).forEach(({ raw: c, eval: ev }) => { list.appendChild(buildCardHtml(c, ev)); shownCount++; });
    const open = rows.filter(e => !occupied(e));
    if (open.length && currentFilter === 'all') list.appendChild(buildOpenBedsLine(open));
  });

  emptyState.style.display = (shownCount === 0 && currentFilter !== 'all') ? 'block' : 'none';
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => {
    const on = b.dataset.filter === f;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  renderClients();
}

// ⚠️ Update this if the repo/branch/filename ever changes
const fileUrl = 'https://raw.githubusercontent.com/melissacallis/excel_to_github/main/Client_Needs_Tracker_Finalexcel.xlsx';
const SHEET_NAME = 'Client Status Board';
const REFRESH_MS = 60 * 1000; // 60s auto-refresh

// Written by Power Automate (via the "Update from Excel" GitHub Action). Used first when present.
const jsonUrl = 'https://raw.githubusercontent.com/melissacallis/excel_to_github/main/data/client_status.json';

async function fetchJsonRows() {
  try {
    const res = await fetch(jsonUrl + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return null;
    const rows = await res.json();
    return Array.isArray(rows) ? rows : null;
  } catch (e) {
    return null;
  }
}

function showLoaded() {
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('error-state').style.display = 'none';
  document.getElementById('last-updated').innerHTML = '<span class="status-dot" aria-hidden="true"></span>Updated ' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  renderClients();
}

async function fetchData() {
  try {
    const jsonRows = await fetchJsonRows();
    if (jsonRows) {
      clients = jsonRows.filter(r => r['Member ID']); // drop blank rows
      showLoaded();
      return;
    }
    // Fallback: read the workbook directly.
    // cache-bust: raw.githubusercontent.com CDN-caches for ~5 min otherwise
    const bustUrl = fileUrl + (fileUrl.includes('?') ? '&' : '?') + 't=' + Date.now();
    const res = await fetch(bustUrl, { cache: 'no-store' });
    if (!res.ok) { showError('File not found on GitHub (status ' + res.status + '). Check the repo/filename in fileUrl.'); return; }
    const data = await res.arrayBuffer();
    const wb = XLSX.read(data, { type: 'array', cellDates: false });
    const sheet = wb.Sheets[SHEET_NAME];
    if (!sheet) { showError('Sheet "' + SHEET_NAME + '" not found. Sheets in file: ' + wb.SheetNames.join(', ')); return; }
    // header row is row 4 in the sheet (0-indexed row 3), matches the workbook layout
    const json = XLSX.utils.sheet_to_json(sheet, { range: 3, defval: null, raw: false });
    clients = json.filter(r => r['Member ID']); // drop blank rows
    showLoaded();
  } catch (err) {
    showError('Error loading data: ' + err.message);
  }
}

function showError(msg) {
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('error-state').style.display = 'block';
  document.getElementById('error-state').textContent = msg;
}

function refreshNow() { fetchData(); }

refreshTimer = setInterval(fetchData, REFRESH_MS);
setInterval(function () { if (clients && clients.length) renderClients(); }, 60 * 1000);

// pause polling when tab isn't visible, resume + refresh immediately when it is
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (refreshTimer) clearInterval(refreshTimer);
  } else {
    fetchData();
    refreshTimer = setInterval(fetchData, REFRESH_MS);
  }
});

fetchData();
</script>
