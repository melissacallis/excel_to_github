<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCentral &middot; Magnet Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c2b29; --slate: #48605c; --muted: #5f716e; --line: #dfe6e2; --paper: #f3f5f9; --card: #fff;
    --navy: #16234a; --sapphire: #2d4a8a; --tint: #e7ecf7; --accent: #f4a259; --red: #a32d2d;
    --shadow: 0 1px 2px rgba(20,40,35,0.06), 0 4px 14px rgba(20,40,35,0.05);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "IBM Plex Sans", "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--sapphire); outline-offset: 2px; }
  header button:focus-visible, header a:focus-visible { outline-color: #fff; }

  header {
    background:
      radial-gradient(ellipse 60% 120% at 8% -10%, rgba(92,128,214,0.55), transparent 60%),
      linear-gradient(160deg, #1d2d5c 0%, #16234a 55%, #101a38 100%);
    color: #fff; padding: 22px 32px 26px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand svg { width: 34px; height: 34px; }
  .brand .wm { font-family: "Sora", sans-serif; font-weight: 700; font-size: 20px; }
  .brand .wm span { color: var(--accent); }
  .brand h1 { font-family: "Sora", sans-serif; font-weight: 600; font-size: 26px; margin: 2px 0 0; letter-spacing: -0.5px; }
  .back { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.5); color: #fff; text-decoration: none; font-weight: 600; font-size: 14px; }
  .back:hover { background: rgba(255,255,255,0.12); }

  main { max-width: 1180px; margin: 0 auto; padding: 22px 20px 60px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
  .filters { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; padding: 16px 18px; margin-bottom: 16px; }
  .filters label { display: grid; gap: 5px; font-size: 12px; font-weight: 600; color: var(--slate); }
  .filters input, .filters select { min-height: 44px; padding: 0 12px; border: 1px solid #b9c6c2; border-radius: 10px; font: inherit; font-size: 14px; color: var(--ink); background: #fff; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #8a9b97; background: #fff; font: inherit; font-size: 13px; color: var(--slate); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
  .spacer { flex: 1; }
  .btn { min-height: 44px; padding: 0 16px; border-radius: 10px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid #b9c6c2; background: #fff; color: var(--navy); }
  .btn-primary { background: var(--navy); color: #fff; border-color: var(--navy); }

  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { padding: 14px 16px; }
  .stat .n { font-family: "Sora", sans-serif; font-size: 26px; font-weight: 700; }
  .stat .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin-top: 2px; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--slate); font-weight: 700; padding: 12px 12px; border-bottom: 2px solid var(--line); white-space: nowrap; background: #fafbfd; position: sticky; top: 0; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  td.mono { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; white-space: nowrap; }
  .mag { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; font-weight: 600; }
  .act { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .act.placed { background: #e3f1e5; color: #1d5124; }
  .act.updated { background: #e4eaf8; color: #22397a; }
  .act.removed { background: #f1f2f4; color: #4a5250; }
  .act.returned { background: #d8f0fa; color: #0b4f6c; }
  .dur { font-size: 12px; color: var(--muted); margin-left: 6px; white-space: nowrap; }
  td:nth-child(2) { white-space: nowrap; }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); }

  .coin { width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    font-family: "Sora", sans-serif; font-weight: 700; font-size: 11px; letter-spacing: -.2px; border: 1px solid rgba(0,0,0,.08);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.55), 0 2px 0 rgba(0,0,0,.12); }
  .coin.coin-sm { font-size: 9px; }
  .coin svg { width: 19px; height: 19px; }
  .rcheck { position: relative; font-size: 14px; font-weight: 800; padding-right: 2px; }
  .rcheck svg { position: absolute; right: -7px; bottom: -3px; width: 11px; height: 11px; color: #1d7a2d; background: #fff; border-radius: 50%; padding: 1px; box-shadow: 0 0 0 1.2px currentColor; }
  .m-offunit  { background: #cdeefb; color: #0b4f6c; }
  .m-reassess { background: #d9f2dc; color: #1d5124; }
  .m-pw       { background: #ffe1c7; color: #7a3a07; }
  .m-full     { background: #f9d6d6; color: #7a2121; }
  .m-prn      { background: #fde9a6; color: #5e4500; }
  .m-iop      { background: #dfe3fb; color: #2b3a8a; }
  .m-med      { background: #e9edf5; color: #44506b; }

  .lock { max-width: 420px; margin: 40px auto; padding: 22px; }
  .lock h2 { font-family: "Sora", sans-serif; font-size: 18px; margin: 0 0 6px; }
  .lock p { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
  .lock input { width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid #b9c6c2; border-radius: 10px; font: inherit; font-size: 15px; margin-bottom: 10px; }
  .err { color: var(--red); font-size: 13px; min-height: 18px; margin-bottom: 8px; }
  .status { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); }

  @media (max-width: 760px) {
    header { padding: 18px 16px 20px; }
    .brand h1 { font-size: 22px; }
    main { padding: 16px 12px 40px; }
  }
  @media print {
    header, .filters, .no-print { display: none !important; }
    body { background: #fff; }
    .panel { box-shadow: none; border: 0; }
    th { position: static; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <defs><linearGradient id="pc-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfdaf5"/></linearGradient></defs>
      <rect x="1" y="1" width="38" height="38" rx="11" fill="url(#pc-g)"/>
      <path d="M13 31V10h8.5a7.5 7.5 0 0 1 0 15H13" fill="none" stroke="#16234a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="21" cy="17.5" r="2.6" fill="#f4a259"/>
    </svg>
    <div>
      <div class="wm">P<span>Central</span></div>
      <h1>Magnet Log</h1>
    </div>
  </div>
  <a class="back" href="index.html">&larr; Back to Patient Status</a>
</header>

<main>
  <section class="panel lock" id="lock" style="display:none;">
    <h2>Unlock the magnet log</h2>
    <p>Enter the board PIN. If this device already unlocked the board, it's remembered.</p>
    <form id="pin-form">
      <label for="pin" style="font-size:12.5px;font-weight:600;color:var(--slate);">Board PIN</label>
      <input type="password" inputmode="numeric" autocomplete="off" id="pin" maxlength="12">
      <div class="err" id="pin-err" role="alert"></div>
      <button type="submit" class="btn btn-primary">Unlock</button>
    </form>
  </section>

  <div id="app" style="display:none;">
    <section class="panel filters" aria-label="Filters">
      <div>
        <div style="font-size:12px;font-weight:600;color:var(--slate);margin-bottom:5px;">Range</div>
        <div class="quick" role="group" aria-label="Quick date range">
          <button type="button" class="chip" data-range="today">Today</button>
          <button type="button" class="chip" data-range="7">Last 7 days</button>
          <button type="button" class="chip" data-range="30">Last 30 days</button>
        </div>
      </div>
      <label>From<input type="date" id="from"></label>
      <label>To<input type="date" id="to"></label>
      <label>Magnet
        <select id="type">
          <option value="">All magnets</option>
          <option value="offunit">Off unit</option>
          <option value="reassess">Reassessments complete</option>
          <option value="pw">PW</option>
          <option value="full">Full</option>
          <option value="prn">PRN</option>
          <option value="iop">IOP</option>
          <option value="htn">High blood pressure</option>
          <option value="hiv">HIV</option>
          <option value="seizure">Seizures</option>
          <option value="diabetes">Diabetes</option>
          <option value="medother">Other medical</option>
        </select>
      </label>
      <label>Bed or patient<input type="search" id="q" placeholder="e.g. 2B or R.R."></label>
      <span class="spacer"></span>
      <button type="button" class="btn no-print" id="csv">Download CSV</button>
      <button type="button" class="btn no-print" onclick="window.print()">Print</button>
    </section>

    <section class="summary" id="summary" aria-label="Summary"></section>

    <section class="panel">
      <div class="table-wrap">
        <table>
          <caption class="status" style="caption-side:bottom;text-align:left;padding:10px 12px;" id="status"></caption>
          <thead>
            <tr>
              <th scope="col">When</th>
              <th scope="col">Action</th>
              <th scope="col">Magnet</th>
              <th scope="col">Bed</th>
              <th scope="col">Patient</th>
              <th scope="col">Member ID</th>
              <th scope="col">Time</th>
              <th scope="col">Date</th>
              <th scope="col">Location</th>
              <th scope="col">Note</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="empty" id="empty" style="display:none;">No magnet activity in this range.</div>
    </section>
  </div>
</main>

<script>
const MAGNET_API = 'https://magnets-api-production.up.railway.app';
const PIN_KEY = 'pcentral-board-pin';
const TZ = 'America/Chicago';

const BIRD = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M2.5 15.2c2.6.2 4.6-.7 6.3-3.1 1.6-2.3 3.7-3.7 6.5-3.7 1.4 0 2.6.5 3.5 1.3l2.7-.5-1.9 1.6c.2.5.3 1 .3 1.6 0 3.9-3.4 7-7.8 7H6.3l2.1-1.8c-2.6.1-4.6-.8-5.9-2.4z"/><circle cx="17" cy="11" r="1" fill="#fff"/><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M9 14.5c1.7.6 3.6.3 5-1"/></svg>';
const R_CHECK = '<span class="rcheck">R<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="m4 12.5 5 5L20 6.5"/></svg></span>';
const TYPES = {
  offunit:  { label: 'Off unit', cls: 'm-offunit', sym: BIRD },
  reassess: { label: 'Reassessments complete', cls: 'm-reassess', sym: R_CHECK },
  pw:       { label: 'PW', cls: 'm-pw', sym: 'PW' },
  full:     { label: 'Full', cls: 'm-full', sym: 'Full', small: true },
  prn:      { label: 'PRN', cls: 'm-prn', sym: 'PRN', small: true },
  iop:      { label: 'IOP', cls: 'm-iop', sym: 'IOP', small: true },
  htn:      { label: 'High blood pressure', cls: 'm-med', sym: '<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-9.2-9.3C1.6 7.2 3.9 4.5 7 4.5c2 0 3.6 1.2 5 3 1.4-1.8 3-3 5-3 3.1 0 5.4 2.7 4.2 6.2C19.5 15.4 12 20 12 20z"/><path d="M5.5 12h3l1.5-2.5 2 5 1.5-2.5h5"/></g></svg>' },
  hiv:      { label: 'HIV', cls: 'm-med', sym: '<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13.5C9.6 10.8 8.5 9 8.5 7.2 8.5 5.1 10 3.5 12 3.5s3.5 1.6 3.5 3.7c0 1.8-1.1 3.6-3.5 6.3z"/><path d="M10.2 10.9 6 20.5M13.8 10.9l4.2 9.6"/></g></svg>' },
  seizure:  { label: 'Seizures', cls: 'm-med', sym: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M13.5 2.5 5 13.5h6l-1 8 8.5-11h-6z"/></svg>' },
  diabetes: { label: 'Diabetes', cls: 'm-med', sym: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 3.5c3 4 6 7.3 6 10.8a6 6 0 0 1-12 0C6 10.8 9 7.5 12 3.5z"/></svg>' },
  medother: { label: 'Other medical', cls: 'm-med', sym: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M9.5 4h5v5.5H20v5h-5.5V20h-5v-5.5H4v-5h5.5z"/></svg>' }
};

let pin = '';
try { pin = localStorage.getItem(PIN_KEY) || ''; } catch (e) {}
let events = [];

const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function centralDate(d) { return d.toLocaleDateString('en-CA', { timeZone: TZ }); }
function addDays(iso, n) { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
function fmtWhen(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { timeZone: TZ, month: 'short', day: 'numeric' }) + ' ' +
         d.toLocaleTimeString('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' });
}
function fmtTime12(t) {
  const m = /^(\d{1,2}):(\d{2})/.exec(t || ''); if (!m) return t || '';
  let h = +m[1]; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + m[2] + ' ' + ap;
}
function fmtDate(d) {
  if (!d) return '';
  const x = new Date(d + 'T12:00:00'); return isNaN(x) ? d : x.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
// Minutes between the magnet's own date+time (Central) and when it was removed.
function offUnitMinutes(e) {
  if (!e.date || !e.time) return null;
  const leftLocal = new Date(e.date + 'T' + e.time + ':00');
  const removedLocal = new Date(new Date(e.at).toLocaleString('en-US', { timeZone: TZ }));
  const mins = Math.round((removedLocal - leftLocal) / 60000);
  return mins >= 0 && mins < 60 * 24 * 14 ? mins : null;
}
function fmtDur(m) { if (m == null) return ''; const h = Math.floor(m / 60), r = m % 60; return h ? `${h}h ${r}m` : `${r}m`; }
function coin(t) { const d = TYPES[t]; return d ? `<span class="coin ${d.cls}${d.small ? ' coin-sm' : ''}" aria-hidden="true">${d.sym}</span>` : ''; }
function actionOf(e) { return e.type === 'offunit' && e.action === 'removed' ? 'returned' : e.action; }
const ACTION_LABEL = { placed: 'Placed', updated: 'Edited', removed: 'Removed', returned: 'Back on unit' };

async function api(path) {
  const res = await fetch(MAGNET_API + path, { headers: { 'X-Board-Pin': pin }, cache: 'no-store' });
  if (res.status === 401) { const e = new Error('pin'); e.pin = true; throw e; }
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function load() {
  const from = $('from').value, to = $('to').value;
  $('status').textContent = 'Loading…';
  try {
    const data = await api('/log?from=' + encodeURIComponent(from) + '&to=' + encodeURIComponent(to));
    events = data.events || [];
    render();
    $('status').textContent = 'Updated ' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) + ' · refreshes every minute';
  } catch (err) {
    if (err.pin) { showLock('That PIN no longer works.'); return; }
    $('status').textContent = 'Can’t reach the magnet board right now.';
  }
}

function filtered() {
  const type = $('type').value, q = $('q').value.trim().toLowerCase();
  return events.filter(e => (!type || e.type === type) &&
    (!q || [e.bed, e.initials, e.memberId, e.location, e.note].some(v => String(v || '').toLowerCase().includes(q))));
}

function render() {
  const list = filtered();
  $('rows').innerHTML = list.map(e => {
    const a = actionOf(e); const d = TYPES[e.type] || { label: e.type };
    const dur = a === 'returned' ? offUnitMinutes(e) : null;
    return `<tr>
      <td class="mono">${esc(fmtWhen(e.at))}</td>
      <td><span class="act ${a}">${ACTION_LABEL[a] || esc(a)}</span>${dur != null ? `<span class="dur">after ${fmtDur(dur)}</span>` : ''}</td>
      <td><span class="mag">${coin(e.type)}${esc(d.label)}</span></td>
      <td class="mono">${esc(e.bed)}</td>
      <td>${esc(e.initials || '')}</td>
      <td class="mono">${esc(e.memberId || '')}</td>
      <td class="mono">${esc(fmtTime12(e.time))}</td>
      <td class="mono">${esc(fmtDate(e.date))}</td>
      <td>${esc(e.location || '')}</td>
      <td>${esc(e.note || '')}</td>
    </tr>`;
  }).join('');
  $('empty').style.display = list.length ? 'none' : 'block';

  const placed = list.filter(e => e.action === 'placed').length;
  const offTrips = list.filter(e => e.type === 'offunit' && e.action === 'placed').length;
  const durs = list.filter(e => actionOf(e) === 'returned').map(offUnitMinutes).filter(m => m != null);
  const avg = durs.length ? Math.round(durs.reduce((x, y) => x + y, 0) / durs.length) : null;
  const patients = new Set(list.map(e => e.key)).size;
  $('summary').innerHTML = [
    [list.length, 'Log entries'], [placed, 'Magnets placed'], [offTrips, 'Off-unit trips'],
    [avg == null ? '—' : fmtDur(avg), 'Avg time off unit'], [patients, 'Patients']
  ].map(([n, l]) => `<div class="panel stat"><div class="n">${esc(n)}</div><div class="l">${esc(l)}</div></div>`).join('');
}

function csv() {
  const head = ['When', 'Action', 'Magnet', 'Bed', 'Patient', 'Member ID', 'Time', 'Date', 'Location', 'Note', 'Minutes off unit'];
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const lines = filtered().map(e => {
    const a = actionOf(e);
    return [fmtWhen(e.at), ACTION_LABEL[a] || a, (TYPES[e.type] || {}).label || e.type, e.bed, e.initials, e.memberId,
            fmtTime12(e.time), e.date, e.location, e.note, a === 'returned' ? offUnitMinutes(e) : ''].map(q).join(',');
  });
  const blob = new Blob([head.map(q).join(',') + '\n' + lines.join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `magnet-log_${$('from').value}_to_${$('to').value}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}

function setRange(r) {
  const today = centralDate(new Date());
  $('to').value = today;
  $('from').value = r === 'today' ? today : addDays(today, -(parseInt(r, 10) - 1));
  document.querySelectorAll('[data-range]').forEach(b => b.setAttribute('aria-pressed', b.dataset.range === r ? 'true' : 'false'));
  load();
}

function showLock(msg) {
  pin = ''; try { localStorage.removeItem(PIN_KEY); } catch (e) {}
  $('app').style.display = 'none'; $('lock').style.display = 'block';
  $('pin-err').textContent = msg || ''; $('pin').focus();
}
function showApp() {
  $('lock').style.display = 'none'; $('app').style.display = 'block';
  setRange('7');
}

$('pin-form').addEventListener('submit', async e => {
  e.preventDefault();
  const tryPin = $('pin').value.trim(); if (!tryPin) return;
  pin = tryPin;
  try {
    await api('/log?from=' + centralDate(new Date()));
    try { localStorage.setItem(PIN_KEY, tryPin); } catch (err) {}
    showApp();
  } catch (err) {
    $('pin-err').textContent = err.pin ? 'That PIN didn’t work. Try again.' : 'Can’t reach the magnet board right now.';
    pin = '';
  }
});
document.querySelectorAll('[data-range]').forEach(b => b.addEventListener('click', () => setRange(b.dataset.range)));
['from', 'to'].forEach(id => $(id).addEventListener('change', () => {
  document.querySelectorAll('[data-range]').forEach(b => b.setAttribute('aria-pressed', 'false')); load();
}));
$('type').addEventListener('change', render);
$('q').addEventListener('input', render);
